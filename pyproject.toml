[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rbac-auditor"
description = "Snapshot Kubernetes RBAC and diff it under a policy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
# A floor, not a pin: requirements.txt is the pinned, hash-checked lockfile
# the image installs from, and pinning here as well would make a `pip install`
# of this package fight whatever the environment already has.
dependencies = ["pyyaml>=6"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/rbac-auditor"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
rbac-audit = "rbac_audit:main"

[tool.setuptools]
py-modules = ["rbac_audit"]

# Read from the one place the version already lives, so a release bump does not
# have to be repeated here and cannot drift from it.
[tool.setuptools.dynamic]
version = { file = "version.txt" }

# The man page rides along in the wheel: `pip install` puts it under
# <prefix>/share/man/man1, which is on the default manpath for a system install
# and for a --user one alike.
[tool.setuptools.data-files]
"share/man/man1" = ["man/rbac-audit.1"]
