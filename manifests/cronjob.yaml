# Weekly RBAC report into the job logs (ship with your log pipeline).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rbac-auditor
  namespace: security
spec:
  schedule: "0 5 * * 1"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: rbac-auditor
          restartPolicy: Never
          # The image declares USER 10001; stating it here means an image
          # change cannot quietly move this onto root.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: audit
              # Pinned: the bare name resolved to :latest, which would silently
              # change what this cluster-reader runs. Matches publish.yml.
              image: ghcr.io/fabiocicerchia/rbac-auditor:1.0.0
              args: ["report"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              # It reads the RBAC API and writes a report to stdout; no CPU
              # limit on purpose, since throttling a weekly job buys nothing.
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: rbac-auditor, namespace: security }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: rbac-auditor-read }
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, clusterroles, rolebindings, clusterrolebindings]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [serviceaccounts, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: rbac-auditor-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rbac-auditor-read }
subjects: [{ kind: ServiceAccount, name: rbac-auditor, namespace: security }]
