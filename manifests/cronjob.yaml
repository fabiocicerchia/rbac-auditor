# Weekly RBAC snapshot into the job logs (ship with your log pipeline, or
# redirect it into a repository you commit).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rbac-auditor
  namespace: security
spec:
  schedule: "0 5 * * 1"
  # A run missed by more than an hour is skipped, not started at a random time.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            container.apparmor.security.beta.kubernetes.io/audit: runtime/default
        # False positive for "token automount not disabled": the token is how
        # this job reads the RBAC API, so it has to be mounted.
        # kics-scan ignore-line
        spec:
          serviceAccountName: rbac-auditor
          restartPolicy: Never
          # The image declares USER 10001; stating it here means an image
          # change cannot quietly move this onto root.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: audit
              # Pinned: the bare name resolved to :latest, which would silently
              # change what this cluster-reader runs. publish.yml tags each
              # release with its version; keep this equal to version.txt.
              image: ghcr.io/fabiocicerchia/rbac-auditor:2.0.1  # VERSION-BUMP
              imagePullPolicy: Always
              args: ["snapshot"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              # It reads the RBAC API and writes a snapshot to stdout; no CPU
              # limit on purpose, since throttling a weekly job buys nothing.
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: rbac-auditor, namespace: security }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: rbac-auditor-read }
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, clusterroles, rolebindings, clusterrolebindings]
    verbs: [get, list]
  # pods is for the unused-ServiceAccount rule: an account no pod mounts
  # cannot be found from RBAC objects alone. They never enter the snapshot.
  - apiGroups: [""]
    resources: [serviceaccounts, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: rbac-auditor-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rbac-auditor-read }
subjects: [{ kind: ServiceAccount, name: rbac-auditor, namespace: security }]
