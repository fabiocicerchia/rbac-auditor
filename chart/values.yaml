kind: CronJob

image:
  repository: ghcr.io/fabiocicerchia/rbac-auditor
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

command: []
args: ["report"]

env: {}
envFrom: []

config:
  mountPath: /etc/rbac-auditor
  files: {}

cron:
  schedule: "0 6 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  restartPolicy: OnFailure
  backoffLimit: 3

service:
  enabled: false
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls: []

livenessProbe: {}
readinessProbe: {}

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

persistence:
  enabled: false
  mountPath: /data
  existingClaim: ""
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  clusterWide: true
  rules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["serviceaccounts", "namespaces", "pods"]
      verbs: ["get", "list"]

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
