name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Lint and secret scanning live in code-quality.yml and security.yml.
# This workflow runs the tests — without it nothing here proves they pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The unit tests import rbac_audit, which imports PyYAML for the policy
      # file. Without this the suite fails on the import, not on a bug.
      - name: Install runtime dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run unit tests, then build the image and smoke-test it
        run: make test
